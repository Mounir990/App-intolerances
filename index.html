<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'app gère elle-même les zones sûres (encoche, barre de gestes Android) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f3" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Thème mémorisé en local (copie de Réglages) pour éviter un éclair clair au démarrage.
      try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t } catch (e) {}
    </script>
    <meta name="description" content="Diario de síntomas · Journal de symptômes — 100 % local" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Diario de síntomas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
